# run with the following command:
# dosbox -conf dos.conf

[sdl]
vsync=false

[dosbox]
memsize=64

[cpu]
core=dynamic
cputype=386
#cycles=200000
#cycles=max
cycles=fixed 200000

[autoexec]

# Project drive: mount the project directory as C:\ in DOS.
mount c /home/fabio/mData/projects/ps1-dev/projects/demo
# SDK drive: independent of the project location.
mount d /home/fabio/mData/projects/ps1-dev/psyq

C:

set PATH=D:\psyq;
set PSX_PATH=D:\psyq
set LIBRARY_PATH=D:\lib
set C_PLUS_INCLUDE_PATH=D:\include
set C_INCLUDE_PATH=D:\include
set PSYQ_PATH=D:\psyq

set COMPILER_PATH=D:\psyq
set GO32=DPMISTACK 1000000
set G032TMP=D:\TEMP
set TMPDIR=D:\TEMP

cd \src
psymake 16bit > BUILD.LOG
if errorlevel 1 pause

exit
